<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles - Camera App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f0f13; --card: #18181b; --border: #27272a;
      --text: #e4e4e7; --muted: #a1a1aa; --heading: #fff; --accent: #93c5fd;
    }
    body.light {
      --bg: #f4f4f5; --card: #fff; --border: #e4e4e7;
      --text: #3f3f46; --muted: #71717a; --heading: #18181b; --accent: #2563eb;
    }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      padding: 30px 16px; transition: 0.3s;
    }
    .theme-toggle {
      position: fixed; top: 20px; right: 20px;
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card);
      font-size: 1.2rem; cursor: pointer; z-index: 10;
    }
    h1 { text-align: center; color: var(--heading); margin-bottom: 8px; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 30px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; max-width: 1000px; margin: 0 auto;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; transition: 0.25s;
      text-decoration: none; color: inherit;
    }
    .card:hover { transform: translateY(-5px); }
    .card-img {
      height: 140px; display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem; background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    }
    .card-body { padding: 16px; }
    .tag {
      font-size: 0.75rem; color: var(--accent);
      background: rgba(147,197,253,0.12); padding: 3px 10px;
      border-radius: 50px; display: inline-block; margin-bottom: 8px;
    }
    .card h2 { font-size: 1.05rem; color: var(--heading); margin-bottom: 6px; }
    .excerpt { font-size: 0.9rem; color: var(--muted); margin-bottom: 10px; }
    .meta { font-size: 0.8rem; color: var(--muted); display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle">🌙</button>

  <h1>Articles & Guides</h1>
  <p class="subtitle">Photography tips and tutorials</p>

  <div class="grid" id="grid"></div>

  <script>
    // Theme
    const btn = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light');
      btn.textContent = '☀️';
    }
    btn.onclick = () => {
      document.body.classList.toggle('light');
      const isLight = document.body.classList.contains('light');
      btn.textContent = isLight ? '☀️' : '🌙';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    };

    // Load articles (Fixed paths)
    fetch('articles/articles.json')
      .then(res => res.json())
      .then(data => {
        const grid = document.getElementById('grid');
        data.forEach(article => {
          const a = document.createElement('a');
          a.href = `articles/article-${article.id}.html`;
          a.className = 'card';
          a.innerHTML = `
            <div class="card-img">${article.emoji}</div>
            <div class="card-body">
              <span class="tag">${article.tag}</span>
              <h2>${article.title}</h2>
              <p class="excerpt">${article.excerpt}</p>
              <div class="meta">
                <span>${article.readTime}</span>
                <span>${article.date}</span>
              </div>
            </div>
          `;
          grid.appendChild(a);
        });
      })
      .catch(() => {
        document.getElementById('grid').innerHTML = '<p style="text-align:center">Could not load articles.json</p>';
      });
  </script>
</body>
</html>
